  </text>
  <path id="banner-curve" d="M520 3455 C1100 3385 1900 3385 2480 3455" fill="none"/>

  <rect width="3000" height="4000" filter="url(#grain)" style="mix-blend-mode:multiply"/>

  <g id="stimpy-sig" transform="translate(2730 3830)">
