    <path d="M1300 2230v-70q0 -18 18 -18h28q18 0 18 18v70zM1370 2230v-60q0 -18 18 -18h28q18 0 18 18v60zM1440 2230v-55q0 -18 18 -18h28q18 0 18 18v55zM1510 2230v-55q0 -18 18 -18h28q18 0 18 18v55zM1580 2230v-60q0 -18 18 -18h28q18 0 18 18v60zM1650 2230v-70q0 -18 18 -18h28q18 0 18 18v70z"/>
