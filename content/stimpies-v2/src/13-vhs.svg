<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 4000" width="3000" height="4000">
  <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;family=Anton&amp;family=Libre+Baskerville:ital@1&amp;family=Oswald:wght@500;700&amp;family=Bebas+Neue&amp;display=block');</style>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.2"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="mist" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="moontex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="4" seed="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.42  0 0 0 -1.6 1.1"/>
    </filter>
    <clipPath id="moonclip"><circle cx="1500" cy="1420" r="640"/></clipPath>
    <clipPath id="paint"><rect x="200" y="470" width="2600" height="2560"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05040A"/>
      <stop offset="0.45" stop-color="#2A0E36"/>
      <stop offset="0.8" stop-color="#6E1530"/>
      <stop offset="1" stop-color="#1A0710"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFF8E8"/>
      <stop offset="0.6" stop-color="#FFE2B8"/>
      <stop offset="1" stop-color="#FF9A6E"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#FFD9C9"/>
      <stop offset="0.5" stop-color="#7A1020"/>
      <stop offset="0.53" stop-color="#3A0610"/>
      <stop offset="0.75" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#FFE45C"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#D7263D"/>
    </linearGradient>
  </defs>

  <!-- sleeve -->
  <rect width="3000" height="4000" fill="#0B0B0D"/>

  <!-- top distributor band -->
  <rect x="0" y="160" width="3000" height="230" fill="url(#band)"/>
  <rect x="0" y="400" width="3000" height="18" fill="#FF7A59"/>
  <rect x="0" y="430" width="3000" height="8" fill="#FF7A59" opacity="0.6"/>
  <text x="230" y="318" font-family="Bebas Neue" font-size="140" letter-spacing="14" fill="#0B0B0D">STIMPY HOME VIDEO</text>
  <text x="2770" y="318" text-anchor="end" font-family="Oswald" font-weight="700" font-size="92" letter-spacing="8" fill="#0B0B0D">Nº 013</text>

  <!-- painting -->
  <g clip-path="url(#paint)">
    <rect x="200" y="470" width="2600" height="2560" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#FFF4E6">
      <circle cx="420" cy="640" r="7"/><circle cx="760" cy="560" r="5"/><circle cx="2380" cy="610" r="8"/>
      <circle cx="2620" cy="820" r="5"/><circle cx="560" cy="980" r="4"/><circle cx="2500" cy="1100" r="5"/>
      <circle cx="330" cy="1300" r="6"/><circle cx="2700" cy="1500" r="4"/><circle cx="980" cy="700" r="4"/><circle cx="2050" cy="560" r="5"/>
    </g>
    <!-- moon glow + moon -->
    <circle cx="1500" cy="1420" r="900" fill="#FF7A59" opacity="0.35" filter="url(#soft)"/>
    <circle cx="1500" cy="1420" r="640" fill="url(#moon)"/>
    <g clip-path="url(#moonclip)">
      <rect x="860" y="780" width="1280" height="1280" filter="url(#moontex)" opacity="0.55"/>
      <circle cx="1320" cy="1250" r="110" fill="#E8B48E" opacity="0.28"/>
      <circle cx="1700" cy="1600" r="150" fill="#E8B48E" opacity="0.25"/>
      <circle cx="1620" cy="1150" r="60" fill="#E8B48E" opacity="0.3"/>
    </g>
    <!-- bats -->
    <g fill="#0B0B0D">
      <path d="M1180 960 q40 -50 80 -10 q20 -30 40 0 q40 -40 80 10 q-50 -10 -80 30 q-30 -30 -40 0 q-30 -40 -80 -30z"/>
      <path d="M1880 1080 q30 -38 60 -8 q15 -22 30 0 q30 -30 60 8 q-38 -8 -60 22 q-22 -22 -30 0 q-22 -30 -60 -22z"/>
      <path d="M2160 860 q22 -28 44 -6 q11 -16 22 0 q22 -22 44 6 q-28 -6 -44 16 q-16 -16 -22 0 q-16 -22 -44 -16z"/>
    </g>
    <!-- dead trees -->
    <g fill="none" stroke="#0B0B0D" stroke-linecap="round">
      <path d="M420 3030 C430 2600 400 2300 470 1950" stroke-width="70"/>
      <path d="M460 2200 C380 2050 300 1990 230 1960" stroke-width="34"/>
      <path d="M470 2050 C560 1900 640 1850 720 1830" stroke-width="30"/>
      <path d="M470 1960 C460 1850 500 1760 560 1700" stroke-width="22"/>
      <path d="M640 1860 C660 1790 700 1760 750 1740" stroke-width="14"/>
      <path d="M2600 3030 C2580 2650 2620 2350 2540 2080" stroke-width="70"/>
      <path d="M2560 2300 C2660 2180 2730 2140 2800 2120" stroke-width="32"/>
      <path d="M2545 2150 C2460 2010 2380 1970 2300 1950" stroke-width="28"/>
      <path d="M2540 2080 C2550 1980 2520 1900 2470 1840" stroke-width="20"/>
    </g>
    <!-- hill -->
    <path d="M200 2620 C700 2380 1100 2300 1500 2300 C1900 2300 2300 2380 2800 2620 L2800 3030 L200 3030 Z" fill="#0B0B0D"/>
    <!-- hooded figure on the hill, back turned, panel glowing -->
    <path fill="#0B0B0D" stroke="#FF7A59" stroke-width="10" stroke-opacity="0.75" d="M1500 1585 C1530 1592 1612 1660 1626 1790 L1702 1830 C1762 1860 1792 1912 1802 1982 L1880 2620 L1120 2620 L1198 1982 C1208 1912 1238 1860 1298 1830 L1374 1790 C1388 1665 1462 1598 1500 1585 Z"/>
    <path d="M1330 1960 L1316 2330 M1670 1960 L1684 2330" stroke="#24242A" stroke-width="10" fill="none"/>
    <rect x="1410" y="1950" width="180" height="240" fill="#FF7A59" opacity="0.92"/>
    <rect x="1410" y="1950" width="180" height="240" fill="#FFE45C" opacity="0.35" filter="url(#glow)"/>
    <text x="1500" y="2125" text-anchor="middle" font-family="Anton" font-size="140" fill="#0B0B0D">?</text>
    <!-- mist -->
    <g filter="url(#mist)" fill="#C9B6FF" opacity="0.35">
      <ellipse cx="700" cy="2700" rx="700" ry="120"/>
      <ellipse cx="2200" cy="2760" rx="800" ry="130"/>
      <ellipse cx="1500" cy="2880" rx="1100" ry="140"/>
    </g>
  </g>
  <rect x="200" y="470" width="2600" height="2560" fill="none" stroke="#2A2A2E" stroke-width="10"/>

  <!-- tagline -->
  <text x="1500" y="640" text-anchor="middle" font-family="Libre Baskerville" font-style="italic" font-size="96" fill="#FFF4E6">Once it's gone… it's gone.</text>

  <!-- airbrushed chrome title -->
  <g transform="translate(1500 3010) skewX(-8)">
    <text x="0" y="0" text-anchor="middle" font-family="Anton" font-size="620" letter-spacing="10" fill="#FF2D3D" filter="url(#glow)" opacity="0.9">THE DROP</text>
    <text x="0" y="0" text-anchor="middle" font-family="Anton" font-size="620" letter-spacing="10" fill="none" stroke="#0B0B0D" stroke-width="40" stroke-linejoin="round">THE DROP</text>
    <text x="0" y="0" text-anchor="middle" font-family="Anton" font-size="620" letter-spacing="10" fill="url(#chrome)" stroke="#FFF4E6" stroke-width="6">THE DROP</text>
  </g>
  <!-- lens flare on title -->
  <g transform="translate(2120 2500)" fill="#FFFFFF">
    <circle r="22"/>
    <path d="M0 -150 L10 0 L0 150 L-10 0 Z"/>
    <path d="M-220 0 L0 -8 L220 0 L0 8 Z"/>
  </g>

  <!-- credits block -->
  <text x="1500" y="3230" text-anchor="middle" font-family="Oswald" font-weight="500" font-size="58" letter-spacing="10" fill="#B8B3AA">STIMPY PICTURES PRESENTS · A ZIPPER PRODUCTION · ONE HOODIE · MANY FACES</text>

  <!-- bottom labels -->
  <g transform="translate(250 3330)">
    <rect width="380" height="330" fill="none" stroke="#FFF4E6" stroke-width="10"/>
    <text x="190" y="215" text-anchor="middle" font-family="Anton" font-size="220" fill="#FFF4E6">S</text>
    <rect y="260" width="380" height="70" fill="#FFF4E6"/>
    <text x="190" y="314" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="46" letter-spacing="4" fill="#0B0B0D">STIMPIES ONLY</text>
  </g>
  <g transform="translate(700 3330)">
    <rect width="560" height="150" fill="#FFF4E6"/>
    <text x="280" y="108" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="92" letter-spacing="6" fill="#0B0B0D">HI-FI STEREO</text>
    <text x="0" y="260" font-family="Oswald" font-weight="500" font-size="54" letter-spacing="6" fill="#B8B3AA">COLOR · 92 MIN</text>
    <text x="0" y="330" font-family="Oswald" font-weight="500" font-size="54" letter-spacing="6" fill="#B8B3AA">LIMITED RELEASE</text>
  </g>
  <!-- rental stickers -->
  <g transform="translate(1720 3510) rotate(-12)">
    <circle r="230" fill="#FFE45C"/>
    <circle r="200" fill="none" stroke="#0B0B0D" stroke-width="6" stroke-dasharray="14 10"/>
    <text y="-30" text-anchor="middle" font-family="Anton" font-size="96" fill="#0B0B0D">BE KIND,</text>
    <text y="80" text-anchor="middle" font-family="Anton" font-size="110" fill="#0B0B0D">REWIND</text>
  </g>
  <g transform="translate(2290 3440) rotate(6)">
    <rect x="-150" y="-110" width="300" height="220" rx="16" fill="#FF7A59"/>
    <text y="-28" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="56" fill="#0B0B0D">2-NIGHT</text>
    <text y="62" text-anchor="middle" font-family="Anton" font-size="110" fill="#0B0B0D">RENTAL</text>
  </g>

  <!-- sleeve wear: scuffs + grain -->
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.12" fill="none">
    <path d="M300 900 L700 870"/><path d="M2200 1800 L2650 1760"/><path d="M500 2400 L620 2500"/>
    <path d="M1800 700 L2100 720"/><path d="M900 3600 L1300 3580"/>
  </g>
  <rect width="3000" height="4000" filter="url(#grain)" style="mix-blend-mode:screen" opacity="0.5"/>

  <g id="stimpy-sig" transform="translate(2730 3760)">
    <clipPath id="sigL"><rect x="-200" y="-300" width="200" height="400"/></clipPath>
    <clipPath id="sigR"><rect x="0" y="-300" width="200" height="400"/></clipPath>
    <text x="0" y="0" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="300" fill="#FFFFFF" clip-path="url(#sigL)">S</text>
    <text x="0" y="22" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="300" fill="none" stroke="#FF7A59" stroke-width="11" clip-path="url(#sigR)">S</text>
  </g>
</svg>
