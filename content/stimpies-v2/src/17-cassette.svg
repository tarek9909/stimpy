<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 4000" width="3000" height="4000">
  <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;family=Anton&amp;family=Permanent+Marker&amp;family=Caveat:wght@600&amp;family=Oswald:wght@500;700&amp;display=block');</style>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.2"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="24" dy="36" stdDeviation="22" flood-color="#5A1A0A" flood-opacity="0.45"/>
    </filter>
    <pattern id="halftone" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="28" cy="28" r="10" fill="#E5603F"/>
    </pattern>
    <pattern id="lines" y="34" width="10" height="92" patternUnits="userSpaceOnUse">
      <rect y="88" width="10" height="4" fill="#5CC8FF" opacity="0.55"/>
    </pattern>
    <radialGradient id="tape" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.35" stop-color="#2B1D16"/>
      <stop offset="0.9" stop-color="#4A3226"/>
      <stop offset="1" stop-color="#2B1D16"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2E30"/>
      <stop offset="1" stop-color="#151516"/>
    </linearGradient>
    <clipPath id="window"><rect x="980" y="1290" width="1040" height="380" rx="60"/></clipPath>
    <g id="hub">
      <circle r="72" fill="#F2EEE8"/>
      <circle r="40" fill="#151516"/>
      <g fill="#F2EEE8">
        <rect x="-10" y="-52" width="20" height="26"/>
        <rect x="-10" y="-52" width="20" height="26" transform="rotate(60)"/>
        <rect x="-10" y="-52" width="20" height="26" transform="rotate(120)"/>
        <rect x="-10" y="-52" width="20" height="26" transform="rotate(180)"/>
        <rect x="-10" y="-52" width="20" height="26" transform="rotate(240)"/>
        <rect x="-10" y="-52" width="20" height="26" transform="rotate(300)"/>
      </g>
    </g>
    <g id="screw">
      <circle r="34" fill="#8C8C90"/>
      <path d="M-20 0 H20 M0 -20 V20" stroke="#3A3A3C" stroke-width="9"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="3000" height="4000" fill="#FF7A59"/>
  <rect width="3000" height="4000" fill="url(#halftone)" opacity="0.55"/>

  <!-- headline: solid A, outlined B dropped lower (the split-S idea) -->
  <text x="300" y="600" font-family="Anton" font-size="380" letter-spacing="8" fill="#111111">SIDE A</text>
  <text x="2700" y="660" text-anchor="end" font-family="Anton" font-size="380" letter-spacing="8" fill="none" stroke="#FFF4E6" stroke-width="12">SIDE B</text>

  <!-- cassette -->
  <g transform="rotate(-4 1500 1560)" filter="url(#shadow)">
    <rect x="300" y="820" width="2400" height="1500" rx="80" fill="url(#smoke)"/>
    <rect x="330" y="850" width="2340" height="1440" rx="64" fill="none" stroke="#3A3A3C" stroke-width="8"/>
    <!-- label -->
    <rect x="420" y="920" width="2160" height="1060" rx="34" fill="#FFF4E6"/>
    <rect x="420" y="1690" width="2160" height="60" fill="#FF7A59"/>
    <rect x="420" y="1750" width="2160" height="60" fill="#FFE45C"/>
    <rect x="420" y="1810" width="2160" height="60" fill="#5CC8FF"/>
    <rect x="460" y="960" width="150" height="170" fill="#111111"/>
    <text x="535" y="1105" text-anchor="middle" font-family="Anton" font-size="150" fill="#FFF4E6">A</text>
    <text x="2540" y="1010" text-anchor="end" font-family="Oswald" font-weight="700" font-size="52" letter-spacing="6" fill="#111111">C-60 · TYPE I</text>
    <text x="2540" y="1070" text-anchor="end" font-family="Oswald" font-weight="500" font-size="40" letter-spacing="6" fill="#111111">NORMAL POSITION · HIGH MOOD</text>
    <line x1="660" y1="1235" x2="2540" y2="1235" stroke="#111111" stroke-width="4"/>
    <text x="680" y="1205" font-family="Permanent Marker" font-size="150" fill="#111111" transform="rotate(-1.5 1500 1180)">MOOD MIXTAPE vol. 1</text>
    <!-- window + spools -->
    <rect x="980" y="1290" width="1040" height="380" rx="60" fill="#0E0E10"/>
    <g clip-path="url(#window)">
      <circle cx="1240" cy="1480" r="230" fill="url(#tape)"/>
      <circle cx="1760" cy="1480" r="140" fill="url(#tape)"/>
      <rect x="1240" y="1660" width="520" height="14" fill="#2B1D16"/>
      <rect x="980" y="1290" width="1040" height="130" fill="#FFFFFF" opacity="0.06"/>
    </g>
    <use href="#hub" transform="translate(1240 1480) rotate(12)"/>
    <use href="#hub" transform="translate(1760 1480) rotate(40)"/>
    <rect x="980" y="1290" width="1040" height="380" rx="60" fill="none" stroke="#3A3A3C" stroke-width="10"/>
    <text x="760" y="1500" text-anchor="middle" font-family="Caveat" font-weight="600" font-size="96" fill="#111111">Mon</text>
    <path d="M700 1530 C740 1550 790 1550 830 1530" stroke="#FF7A59" stroke-width="8" fill="none"/>
    <text x="2240" y="1500" text-anchor="middle" font-family="Caveat" font-weight="600" font-size="96" fill="#111111">Fri!!</text>
    <!-- bottom trapezoid + guide holes -->
    <path d="M760 2320 L900 2060 L2100 2060 L2240 2320 Z" fill="#232325" stroke="#3A3A3C" stroke-width="8"/>
    <circle cx="1130" cy="2200" r="40" fill="#0E0E10"/>
    <circle cx="1870" cy="2200" r="40" fill="#0E0E10"/>
    <rect x="1380" y="2160" width="70" height="80" fill="#0E0E10"/>
    <rect x="1550" y="2160" width="70" height="80" fill="#0E0E10"/>
    <use href="#screw" transform="translate(400 920)"/>
    <use href="#screw" transform="translate(2600 920)"/>
    <use href="#screw" transform="translate(400 2220)"/>
    <use href="#screw" transform="translate(2600 2220)"/>
    <use href="#screw" transform="translate(1500 2010)"/>
  </g>

  <!-- J-card tracklist -->
  <g transform="rotate(3 1500 3050)" filter="url(#shadow)">
    <rect x="380" y="2500" width="2240" height="1120" fill="#FFF4E6"/>
    <rect x="380" y="2620" width="2240" height="1000" fill="url(#lines)"/>
    <line x1="1500" y1="2540" x2="1500" y2="3580" stroke="#111111" stroke-width="4" stroke-dasharray="18 14" opacity="0.5"/>
    <text x="940" y="2640" text-anchor="middle" font-family="Permanent Marker" font-size="110" fill="#111111">SIDE A</text>
    <text x="2060" y="2640" text-anchor="middle" font-family="Permanent Marker" font-size="110" fill="#FF7A59">SIDE B</text>
    <g font-family="Caveat" font-weight="600" font-size="104" fill="#1B2A6B">
      <text x="470" y="2794">1. Monday Face</text>
      <text x="470" y="2886">2. Coffee First</text>
      <text x="470" y="2978">3. Do Not Disturb</text>
      <text x="470" y="3070">4. Small Talk (Skip)</text>
      <text x="470" y="3162">5. Inbox Zero-ish</text>
      <text x="470" y="3254">6. Hood Up</text>
      <text x="1590" y="2794">1. Weekend Me</text>
      <text x="1590" y="2886">2. New Back, Who Dis</text>
      <text x="1590" y="2978">3. Zip It</text>
      <text x="1590" y="3070">4. Main Character</text>
      <text x="1590" y="3162">5. Out Late</text>
      <text x="1590" y="3254">6. Swap Til Sunrise</text>
    </g>
    <path d="M1590 3300 C1780 3330 1980 3310 2140 3290" stroke="#FF7A59" stroke-width="10" fill="none" stroke-linecap="round"/>
    <text x="470" y="3470" font-family="Caveat" font-weight="600" font-size="88" fill="#111111">for: whoever you are today ♥</text>
    <!-- tape strips -->
    <rect x="300" y="2450" width="300" height="100" fill="#FFF8DD" opacity="0.7" transform="rotate(-18 450 2500)"/>
    <rect x="2400" y="2450" width="300" height="100" fill="#FFF8DD" opacity="0.7" transform="rotate(16 2550 2500)"/>
  </g>

  <rect width="3000" height="4000" filter="url(#grain)" style="mix-blend-mode:multiply"/>

  <g id="stimpy-sig" transform="translate(2730 3760)">
    <clipPath id="sigL"><rect x="-200" y="-300" width="200" height="400"/></clipPath>
    <clipPath id="sigR"><rect x="0" y="-300" width="200" height="400"/></clipPath>
    <text x="0" y="0" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="300" fill="#111111" clip-path="url(#sigL)">S</text>
    <text x="0" y="22" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="300" fill="none" stroke="#FFFFFF" stroke-width="11" clip-path="url(#sigR)">S</text>
  </g>
</svg>
