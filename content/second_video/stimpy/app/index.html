<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>STIMPY — Multiple Identities</title>
  <style>
    html, body { margin: 0; background: #000; color: #ddd; font: 12px ui-monospace, monospace; overflow: hidden; }
    #c { display: block; height: 100vh; width: 56.25vh; max-width: 100vw; max-height: 177.78vw; margin: 0 auto; }
    body.export #c { width: 1080px; height: 1920px; max-width: none; max-height: none; margin: 0; }
    body.export #ui { display: none; }
    #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
    #ui.hidden { display: none; }
    #scrub { width: 100%; }
    #marks { position: relative; height: 18px; }
    .mark { position: absolute; top: 0; height: 16px; border-left: 1px solid #666; padding-left: 3px; color: #999; cursor: pointer; overflow: hidden; white-space: nowrap; font-size: 10px; }
    .mark:hover { color: #fff; }
    #errs { display: none; position: fixed; top: 0; left: 0; right: 0; max-height: 40vh; overflow: auto; background: rgba(60,0,0,.9); color: #f99; white-space: pre; padding: 8px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="marks"></div>
    <input id="scrub" type="range" min="0" value="0" />
    <div id="info"></div>
    <div style="color:#777">space play · ←/→ seek · ,/. frame · [ ] scene · l loop · h hide</div>
  </div>
  <pre id="errs"></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
