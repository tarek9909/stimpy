name: stimpy-site
services:
  mysql:
    image: mysql:8.0
    container_name: stimpy-mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stimpy
      MYSQL_USER: stimpy
      MYSQL_PASSWORD: stimpy
    ports: ["3317:3306"]
    volumes:
      - stimpy-mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit
    container_name: stimpy-mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  stimpy-mysql-data:
