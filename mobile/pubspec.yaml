name: stimpy_admin
description: "Stimpy Admin: the dashboard in your pocket (orders, designs, customers)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.6
  photo_view: ^0.15.0
  intl: ^0.20.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  local_auth: ^3.0.2
  fl_chart: ^1.3.0
  onesignal_flutter: ^5.7.2
  lucide_icons_flutter: ^4.0.1
  pdf: ^3.13.1
  printing: ^5.15.1
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Poppins (SIL Open Font License, see assets/fonts/OFL.txt): the brand typeface.
  # The dashboard sets headings in SemiBold (600); the storefront uses Regular/Medium/Bold.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    # Arabic glyphs for names and addresses on printed invoices, labels and delivery sheets
    # (SIL Open Font License, see assets/fonts/OFL-NotoSansArabic.txt).
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/launcher_icon.png
  adaptive_icon_background: "#FF7A59"
  adaptive_icon_foreground: assets/brand/launcher_foreground.png
  min_sdk_android: 24
